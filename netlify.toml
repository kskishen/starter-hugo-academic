[build]
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.87.0"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true

# Old URLs still indexed by search engines
[[redirects]]
  from = "/uploads/Resume2.pdf"
  to = "/uploads/cv.pdf"
  status = 301

[[redirects]]
  from = "/uploads/resume.pdf"
  to = "/uploads/cv.pdf"
  status = 301

[[redirects]]
  from = "/publication/repec-cam-camdae-2302/*"
  to = "/publication/religionandmentalhealth/"
  status = 301

[[redirects]]
  from = "/author/kishen-shastry/*"
  to = "/"
  status = 301
